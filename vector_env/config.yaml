version: 1

physics:
  timestep: 0.005
  integrator: implicitfast
  cone: elliptic
  impratio: 10
  iterations: 50
  ls_iterations: 20
  noslip_iterations: 5
  part_condim: 4
  part_priority: 2
  friction_static_weight: 0.5
