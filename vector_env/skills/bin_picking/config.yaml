version: 1

physics:
  timestep: 0.005
  integrator: implicitfast
  cone: elliptic
  impratio: 10
  iterations: 50
  ls_iterations: 20
  noslip_iterations: 5
  part_condim: 4
  part_priority: 2
  friction_static_weight: 0.5
  maxhullvert: 16
  part_solref: [0.01, 1]
  part_solimp: [0.95, 0.99, 0.001, 0.5, 2]
  min_inertia_radius: 0.01

control:
  hz: 20
  gripper_ctrl_max: 255
  closed_driver: 0.72

cell:
  table: {x: [-0.45, 1.35], y: [-0.95, 0.95], thickness: 0.04}
  park: {x: -4.0, dx: 0.25, z: 2.0}
  default_crate: m
  pile_enabled: false

pile:
  half: [0.22, 0.16]
  half_range: [0.08, 0.30]
  pose: {x: 0.0, y: 0.62, yaw_deg: 0}
  base_keepout_r: 0.30
  lift_base: 0.10
  fill_height: 0.15
  fill_ratio_max: 0.55
  stack: {clearance: 0.005, calm_speed: 0.05, calm_max_ticks: 20, settle_max_ticks: 120}

rain:
  level: 0.58
  level_range: [0.5, 0.667]
  level_tol: 0.02
  count_range: [50, 150]
  freeze_deep: false
  freeze_min_depth: 2
  margin: 0.005
  gap: 0.004
  batch_max: 20
  tries: 40
  clearance: 0.003
  drop: 0.01
  level_cell: 0.01
  level_q: 0.5
  batch_min_ticks: 6
  calm_speed: 0.05
  calm_max_ticks: 40
  settle_max_ticks: 200
  rest_speed: 0.01
  rest_ticks: 6
  bury: {parts: 5, ring: 1.0, size: 0.8, wall: 0.005, tries: 12}
  limits: {parts_total: [1, 150], per_type: [0, 150]}
  physics: {timestep: 0.002, solver: pgs, iterations: 30, noslip_iterations: 3, sleep: true, sleep_tolerance: 0.015}

limits:
  parts_total: [1, 30]
  per_type: [0, 30]
  random_groups: 8
  crate_r: [0.45, 0.95]
  crate_bearing_deg: 70
  corner_r_max: 1.18
  floor_fill_max: 0.7
  robot_q_margin: 0.05

library:
  min_size_mm: 30
  min_mid_mm: 8
  min_mass_g: 10

fill:
  margin: 0.01
  spacing: 0.005
  overlap: 0.6
  overlap_share: 0.4
  max_layers: 2
  lean_min_mass: 0.03
  lean_min_thick: 0.008
  rest_tol: 0.0015
  rest_com_margin: 0.004
  stack_grid: 0.002
  check_rounds: 3
  check_ticks: 40
  check_speed: 0.002
  check_drift: 0.0005
  lift_gap: 0.002
  tries_per_part: 400
  restarts: 25
  ref_radius: 0.03
  settle_max_ticks: 60
  rest_speed: 0.01
  rest_ticks: 6

rules:
  hold_s: 0.5
  lift_clear: 0.05
  lift_dz: 0.03
  settle_speed: 0.02
  out_settle_s: 0.2
  lost_s: 0.2
  end_on_miss: false
  inside_above_rim: 0.6
  floor_below: 0.03
  # pile scenes (rules.mode: pile) only
  crate_hit_force: 75
  target:
    shares: {top: 0.2, blocked: 0.4, buried: 0.25, hidden: 0.15}
    res: 0.003
    min_px: 100
    buried_min_px: 20
    vis_blocked: 0.6
    vis_buried: 0.1
    overlap_px: 3
    depth_share: 0.1
    hidden_max_px: 0
    hidden_vis: 0.05
    hidden_cam_share: 0.15
    press_dz: 0.005

camera:
  width: 224
  height: 168
  fovy_deg: 55
  above_rim: 0.55
  depth_unit: 0.0001
  max_depth: 3.0
