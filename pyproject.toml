[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-env"
version = "0.1.0"
description = "The Vector task environments: scene generators, asset bundles, task rules and the expert step harness, one folder per skill"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "mujoco==4.0.1",
    "numpy==2.5.5",
    "pyyaml==6.0.3",
    "scipy==1.18.1",
    "huggingface_hub==2.4.0",
]

[project.optional-dependencies]
build = ["trimesh==5.2.1", "coacd==1.0.14", "fast-simplification==0.2.0"]
test = ["pytest==9.2.0"]

[project.scripts]
vector-env = "vector_env.command:main"

[tool.setuptools.packages.find]
include = ["vector_env*"]

[tool.setuptools.package-data]
vector_env = ["*.yaml", "skills/*/*.yaml", "skills/*/build/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests", "skills"]
norecursedirs = ["node_modules", ".*", "*.egg-info"]
